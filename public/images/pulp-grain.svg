<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <!-- Define the shape used to build each dot. -->
    <radialGradient id="dot">
      <stop offset="0" stop-color="black" stop-opacity="1"/>
      <stop offset="1" stop-color="black" stop-opacity="0"/>
    </radialGradient>

    <!-- Arrange the dots in an angled grid. -->
    <pattern id="dots"
             width="7"
             height="7"
             patternUnits="userSpaceOnUse"
             patternTransform="rotate(18)">
      <circle cx="3.5"
              cy="3.5"
              r="3.5"
              fill="url(#dot)"/>
    </pattern>

    <!-- Make the dots smaller toward the center. -->
    <radialGradient id="density"
                    cx="50%"
                    cy="50%"
                    r="70%">
      <stop offset="0"
            stop-color="white"
            stop-opacity="0.43"/>

      <stop offset="0.3"
            stop-color="white"
            stop-opacity="0.48"/>

      <stop offset="0.6"
            stop-color="white"
            stop-opacity="0.7"/>

      <stop offset="1"
            stop-color="white"
            stop-opacity="1"/>
    </radialGradient>

    <mask id="radialFade"
          x="0"
          y="0"
          width="800"
          height="400"
          maskUnits="userSpaceOnUse">
      <rect width="800"
            height="400"
            fill="url(#density)"/>
    </mask>

    <!-- Turn the masked dots into the halftone pattern. -->
    <filter id="threshold"
            x="0"
            y="0"
            width="800"
            height="400"
            filterUnits="userSpaceOnUse"
            color-interpolation-filters="sRGB">
      <feComponentTransfer>
        <feFuncA type="linear"
                 slope="8"
                 intercept="-2.7"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- Overall darkness of the finished pattern. -->
  <g opacity="0.3">
    <g filter="url(#threshold)">
      <rect width="800"
            height="400"
            fill="url(#dots)"
            mask="url(#radialFade)"/>
    </g>
  </g>
</svg>